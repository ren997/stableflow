services:
  backend:
    build:
      context: ./backend
    container_name: stableflow-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      JWT_SECRET: ${JWT_SECRET}
      JWT_TOKEN_TTL: ${JWT_TOKEN_TTL:-12h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      SOLANA_NETWORK: ${SOLANA_NETWORK:-DEVNET}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_USDC_MINT: ${SOLANA_USDC_MINT:-}
      SOLANA_CONNECT_TIMEOUT: ${SOLANA_CONNECT_TIMEOUT:-3s}
      SOLANA_READ_TIMEOUT: ${SOLANA_READ_TIMEOUT:-10s}
      SOLANA_RETRY_MAX_ATTEMPTS: ${SOLANA_RETRY_MAX_ATTEMPTS:-3}
      SOLANA_RETRY_DELAY: ${SOLANA_RETRY_DELAY:-500ms}

      SOLANA_SCAN_ENABLED: ${SOLANA_SCAN_ENABLED:-true}
      SOLANA_SCAN_BATCH_SIZE: ${SOLANA_SCAN_BATCH_SIZE:-50}
      SOLANA_SCAN_FIXED_DELAY_MS: ${SOLANA_SCAN_FIXED_DELAY_MS:-30000}
      SOLANA_SCAN_INITIAL_DELAY_MS: ${SOLANA_SCAN_INITIAL_DELAY_MS:-10000}
      SOLANA_SCAN_LOCK_ENABLED: ${SOLANA_SCAN_LOCK_ENABLED:-true}
      SOLANA_SCAN_LOCK_KEY: ${SOLANA_SCAN_LOCK_KEY:-stableflow:job:payment-scan:lock}
      SOLANA_SCAN_LOCK_TTL: ${SOLANA_SCAN_LOCK_TTL:-5m}

      INVOICE_EXPIRE_JOB_ENABLED: ${INVOICE_EXPIRE_JOB_ENABLED:-true}
      INVOICE_EXPIRE_JOB_FIXED_DELAY_MS: ${INVOICE_EXPIRE_JOB_FIXED_DELAY_MS:-30000}
      INVOICE_EXPIRE_JOB_INITIAL_DELAY_MS: ${INVOICE_EXPIRE_JOB_INITIAL_DELAY_MS:-12000}

      PAYMENT_VERIFY_ENABLED: ${PAYMENT_VERIFY_ENABLED:-true}
      PAYMENT_VERIFY_BATCH_SIZE: ${PAYMENT_VERIFY_BATCH_SIZE:-50}
      PAYMENT_VERIFY_FIXED_DELAY_MS: ${PAYMENT_VERIFY_FIXED_DELAY_MS:-30000}
      PAYMENT_VERIFY_INITIAL_DELAY_MS: ${PAYMENT_VERIFY_INITIAL_DELAY_MS:-15000}

      RECONCILIATION_JOB_ENABLED: ${RECONCILIATION_JOB_ENABLED:-true}
      RECONCILIATION_JOB_BATCH_SIZE: ${RECONCILIATION_JOB_BATCH_SIZE:-50}
      RECONCILIATION_JOB_FIXED_DELAY_MS: ${RECONCILIATION_JOB_FIXED_DELAY_MS:-30000}
      RECONCILIATION_JOB_INITIAL_DELAY_MS: ${RECONCILIATION_JOB_INITIAL_DELAY_MS:-20000}

      OUTBOX_JOB_ENABLED: ${OUTBOX_JOB_ENABLED:-true}
      OUTBOX_JOB_BATCH_SIZE: ${OUTBOX_JOB_BATCH_SIZE:-50}
      OUTBOX_JOB_FIXED_DELAY_MS: ${OUTBOX_JOB_FIXED_DELAY_MS:-30000}
      OUTBOX_JOB_INITIAL_DELAY_MS: ${OUTBOX_JOB_INITIAL_DELAY_MS:-25000}
      OUTBOX_JOB_LOCK_ENABLED: ${OUTBOX_JOB_LOCK_ENABLED:-true}
      OUTBOX_JOB_LOCK_KEY: ${OUTBOX_JOB_LOCK_KEY:-stableflow:job:outbox-dispatch:lock}
      OUTBOX_JOB_LOCK_TTL: ${OUTBOX_JOB_LOCK_TTL:-5m}
      OUTBOX_JOB_RETRY_DELAY: ${OUTBOX_JOB_RETRY_DELAY:-1m}

      MERCHANT_OWNERSHIP_CHALLENGE_TTL: ${MERCHANT_OWNERSHIP_CHALLENGE_TTL:-10m}
      AGENT_API_KEY: ${AGENT_API_KEY:-replace-me}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: stableflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
